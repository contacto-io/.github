name: pr-body-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-body:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: PR body follows the org template
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # reads the CURRENT body, so "Re-run" passes once the description is fixed (a re-run replays the old event)
        run: |
          body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          missing=""
          for h in "What" "Why" "Testing"; do
            printf '%s\n' "$body" | grep -qiE "^##[[:space:]]+$h[[:space:]]*$" || missing="$missing ## $h"
          done
          if [ -n "$missing" ]; then
            echo "::error::PR description is missing:$missing. Add the sections (template: https://github.com/contacto-io/.github/blob/main/PULL_REQUEST_TEMPLATE.md), then re-run this check."
            exit 1
          fi
          echo "PR description has What, Why and Testing"
