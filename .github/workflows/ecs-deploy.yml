name: ecs-deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      runs-on:
        type: string
        default: ubuntu-latest-m-cx
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      # the only branch that may deploy; empty means dev for dev, main for prod
      branch:
        type: string
        default: ''
      # overrides vars.AWS_REGION; call once per region (matrix) for multi-region
      aws-region:
        type: string
        default: ''

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # environment first: approval gate and env vars apply before any AWS creds
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    concurrency:
      group: ${{ github.repository }}-${{ inputs.environment }}-${{ inputs.aws-region || vars.AWS_REGION }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Branch guard
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$ENVIRONMENT" in dev) def=dev ;; prod) def=main ;; *) def= ;; esac
          want=${BRANCH:-$def}
          if [ -z "$want" ] || [ "$REF" != "refs/heads/$want" ]; then
            echo "::error::$ENVIRONMENT deploys only from branch '${want:-<set the branch input>}'; got $REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region || vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          echo "uri=$REGISTRY/$REPO:$SHA" >> "$GITHUB_OUTPUT"
          if out=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$SHA" 2>&1); then
            exists=true
          elif grep -q ImageNotFoundException <<< "$out"; then
            exists=false
          else
            echo "$out" >&2
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      # the base image registry may be in a different region than the deploy role's
      - name: Base image registry login
        if: steps.image.outputs.exists == 'false'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          test -f "$DOCKERFILE"
          hosts=$(grep -i '^FROM ' "$DOCKERFILE" | grep -oE '[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com' | sort -u || true)
          for host in $hosts; do
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$host")" | docker login --username AWS --password-stdin "$host"
          done
      - if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$current" --query taskDefinition > task-def.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
      - id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
      - env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          EXPECTED: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          actual=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query "services[0].deployments[?status==\`PRIMARY\`].taskDefinition" --output text)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::PRIMARY deployment is $actual, expected $EXPECTED (rolled back?)"
            exit 1
          fi
